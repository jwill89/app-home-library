# The site's one vhost file, both ports, installed at /etc/apache2/sites-available/<service>.conf
# by every deploy (scripts/deploy.ps1). The deploy enables it, retires any other enabled site
# serving the same names (certbot's, say), and keeps the previous state if Apache refuses it.
# The words between double underscores (the server name and its aliases, the certificate, and
# the app's port) are filled in from the untracked deploy config; the certificate is its folder
# under /etc/letsencrypt/live, and must cover every name.
#
# One site, every name: an alias is not a redirect, so a visitor on any name stays on it.
# ProxyPreserveHost passes the name through: the app checks it against HL_ORIGINS and makes the
# passkey's relying party and the cookie from it.

<VirtualHost *:80>
    ServerName __SERVER_NAME__
    ServerAlias __SERVER_ALIAS__

    RewriteEngine on
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName __SERVER_NAME__
    ServerAlias __SERVER_ALIAS__

    ProxyPreserveHost On
    ProxyPass        /.well-known/acme-challenge/ !
    # The change feed (/api/v1/changes) is a request held open; the app pings it every 25
    # seconds, well inside the timeout here and Cloudflare's 100 seconds.
    ProxyPass        / http://127.0.0.1:__APP_PORT__/ timeout=120
    ProxyPassReverse / http://127.0.0.1:__APP_PORT__/
    RequestHeader set X-Forwarded-Proto expr=%{REQUEST_SCHEME}

    # Cloudflare fronts every name. On connections from its addresses the visitor is who its
    # header names, so the address Apache appends to X-Forwarded-For, which the app's sign-in
    # rate limit reads, is the visitor and not the edge. The list is the droplet's own
    # (/etc/apache2/cloudflare-ips.txt), kept current outside this repository.
    RemoteIPHeader CF-Connecting-IP
    RemoteIPTrustedProxyList /etc/apache2/cloudflare-ips.txt

    # The app takes a cover photo or an import file of up to 16 MB, and a document's file of up
    # to 40 MB; Apache refuses anything larger before reading it.
    LimitRequestBody 17825792
    <LocationMatch "^/api/v1/documents/[0-9]+/files$">
        LimitRequestBody 44040192
    </LocationMatch>

    # /healthz answers publicly, through Cloudflare: the deploy's smoke check fetches it
    # there, and an uptime check can poll it. It returns only the status, version, commit,
    # build date and schema number.

    # A share link's or the calendar's address is its password: those requests go unlogged.
    # The rest go where every other site's do, in the same format.
    SetEnvIf Request_URI "^/(s|calendar)/" nolog
    CustomLog ${APACHE_LOG_DIR}/other_vhosts_access.log vhost_combined env=!nolog

    Header always set Strict-Transport-Security "max-age=31536000"

    Include /etc/letsencrypt/options-ssl-apache.conf
    SSLCertificateFile /etc/letsencrypt/live/__CERT__/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/__CERT__/privkey.pem
</VirtualHost>
</IfModule>
