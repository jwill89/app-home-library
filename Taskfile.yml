version: '3'

dotenv: ['.env']

# The tasks every repo shares, from the shared/ submodule (shared:lint:scripts,
# shared:golangci:check, shared:update and the rest).
includes:
  shared: ./shared/repo/Taskfile.yml

vars:
  MODULE: homelibrary
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo dev
  COMMIT:
    sh: git rev-parse --short HEAD 2>/dev/null || echo none
  BUILD_DATE:
    sh: git log -1 --format=%cI 2>/dev/null || echo unknown
  LDFLAGS: >-
    -s -w
    -X {{.MODULE}}/internal/version.Version={{.VERSION}}
    -X {{.MODULE}}/internal/version.Commit={{.COMMIT}}
    -X {{.MODULE}}/internal/version.BuildDate={{.BUILD_DATE}}

tasks:
  default:
    silent: true
    cmds:
      - task --list

  setup:
    desc: Install frontend dependencies
    dir: web
    cmds:
      - npm ci

  dev:
    desc: Run the Vite dev server and the Go server together
    deps: [dev:web, dev:api]

  dev:web:
    dir: web
    cmds:
      - npm run dev

  dev:api:
    cmds:
      - go run ./cmd/homelibrary serve

  gen:
    desc: Regenerate the committed schema, sqlc code and the TypeScript API client from the OpenAPI document
    # The Go packages embed web/dist, so the frontend must exist before go run compiles them.
    deps: [build:web]
    cmds:
      # internal/db/schema.sql, from a throwaway database the migrations build; sqlc reads it.
      - go test ./internal/db -run TestSchema -count=1 -update
      - sqlc generate
      - go run ./cmd/homelibrary openapi > web/src/api/openapi.json
      - cd web && npx -y openapi-typescript@7.13.0 src/api/openapi.json -o src/api/schema.d.ts
      - cd web && npx prettier --write src/api/schema.d.ts src/api/openapi.json

  build:web:
    dir: web
    # lint and test:coverage both need it and run at once in check; once makes the second
    # wait for the first's build instead of emptying web/dist under it.
    run: once
    cmds:
      - npm run build
    sources:
      - index.html
      - package.json
      - vite.config.ts
      - tsconfig.json
      - tsconfig.app.json
      - tsconfig.node.json
      - src/**/*
      - public/**/*
    generates:
      - dist/index.html

  build:
    desc: Build the frontend and the native binary into dist/
    deps: [build:web]
    cmds:
      - go build -ldflags "{{.LDFLAGS}}" -o dist/homelibrary{{exeExt}} ./cmd/homelibrary

  build:linux:
    desc: Build the static Linux binary the droplet runs
    deps: [build:web]
    env:
      GOOS: linux
      GOARCH: amd64
      CGO_ENABLED: '0'
    cmds:
      - go build -ldflags "{{.LDFLAGS}}" -o dist/homelibrary-linux-amd64 ./cmd/homelibrary

  lint:
    desc: Lint, type-check, and format-check everything
    deps: [build:web]
    cmds:
      - go vet ./...
      # The config is the shared template's with .golangci.local.yml on top; this fails if
      # it has drifted from them.
      - task: shared:golangci:check
      # Built from source with the pinned toolchain, the same way CI installs it.
      - go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0 run ./...
      - task: lint:web
      - task: lint:scripts
      - task: lint:vulns

  # Known vulnerabilities: Go's in the code the app calls; npm's in what ships, from high up,
  # passing over what web/osv-scanner.toml does, as CI's audit does. OSV-Scanner
  # (shared:vuln) holds every package, the tooling's included, at any severity.
  lint:vulns:
    cmds:
      - go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - task: shared:web:audit

  lint:web:
    dir: web
    cmds:
      - npm run lint
      - npm run typecheck
      - npm run format:check

  # PSScriptAnalyzer, with the shared settings, on every tracked script (the local
  # deploy.config.ps1 is the owner's and untracked). Install it once with
  # Install-PSResource PSScriptAnalyzer -Version 1.25.0 -Scope CurrentUser -TrustRepository
  lint:scripts:
    cmds:
      - task: shared:lint:scripts

  test:
    desc: Run the Go and frontend tests, then the end-to-end tests in a browser
    aliases: [tests]
    deps: [build:web]
    cmds:
      - go test ./...
      - cd web && npm test
      - task: test:e2e

  test:coverage:
    desc: Run the Go and frontend tests with coverage, each held to the floor CI holds
    deps: [build:web]
    cmds:
      # go.yml's floor and excludes in ci.yml: sqlc's output stays out of the count.
      - task: shared:go:coverage
        vars: { FLOOR: 57, EXCLUDE: '/internal/db/((db|models)\.go|[^/]+\.sql\.go)$' }
      - cd web && npm run test:coverage

  # The Vitest specs' types under web/tsconfig.vitest.json, as web.yml checks them.
  web:specs:
    cmds:
      - task: shared:web:specs
        vars: { DIR: web }

  # The whole app in a real browser (Edge here, Chrome on CI), against a server of its own, on a
  # throwaway library in the temp folder, never devdata's.
  test:e2e:
    desc: Run the end-to-end suite (Playwright and axe) on the real server, in the installed Edge
    aliases: [e2e, tests:e2e]
    deps: [build:web]
    dir: web
    cmds:
      - npm run test:e2e

  gen:check:
    desc: Run every generator and fail if what they make differs from the tree as it was
    vars:
      # The tree before the generators run, uncommitted changes included, as a commit object
      # that changes nothing (git stash create); a clean tree gives none, and the index stands in.
      BEFORE:
        sh: git stash create
    cmds:
      - task: gen
      - git diff --exit-code {{.BEFORE}} -- internal/db web/src/api

  check:
    desc: Everything CI runs - lint, docs.yml's checks, the specs' types, the tests with their floors and the vulnerability scan at once, then the end-to-end suite and the generated code
    cmds:
      # The steps that don't depend on each other run at once, each line prefixed with
      # its task; the ones that need them follow, in order.
      - task --parallel --output prefixed lint shared:docs:check web:specs test:coverage shared:vuln
      - task: test:e2e
      - task: gen:check

  push:
    desc: Take the in-range updates Dependabot would open, start the self-hosted runners, push, and follow CI to its verdict (-- -Yes, -SkipUpdates, -NoWait)
    interactive: true
    cmds:
      - task: shared:push

  deploy:
    desc: Deploy the newest release to the droplet (pass flags after --)
    cmds:
      - pwsh -NoProfile -File scripts/deploy.ps1 {{.CLI_ARGS}}
