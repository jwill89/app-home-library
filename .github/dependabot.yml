# Weekly dependency updates, on Monday: one pull request per ecosystem for minors and
# patches together, and majors one by one (they can need code changes). The shared/
# submodule moves only with `task shared:update`, so it has no block here.
#
# Dependabot can't read Actions secrets, so FONTAWESOME_NPM_TOKEN (the Font Awesome kit's
# registry) is also kept as a Dependabot secret (Settings, Secrets and variables,
# Dependabot).
version: 2

registries:
  # web/.npmrc names this registry for its scopes; Dependabot adds the token. Give it no
  # `scope:`: with one, Dependabot writes its own .npmrc in place of the committed one,
  # which loses install-links=true, so the lockfile records lint/web and test/a11y as links
  # and npm ci fails.
  fontawesome:
    type: npm-registry
    url: https://npm.fontawesome.com
    token: ${{ secrets.FONTAWESOME_NPM_TOKEN }}

updates:
  - package-ecosystem: npm
    directory: /web
    registries:
      - fontawesome
    schedule:
      interval: weekly
      day: monday
    groups:
      npm-minor:
        patterns: ['*']
        update-types: [minor, patch]
    ignore:
      # Held on purpose: TypeScript stays on 6.x until vue-tsc supports TypeScript 7.1.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # vue-tsc 3.3.14 turns a `//` in a static attribute (placeholder="https://") into
      # broken virtual code, which stops it checking the rest of that template. vue-tsc
      # is pinned at 3.3.13 and only 3.3.14 is skipped, so the fix comes through; drop this
      # once it has.
      - dependency-name: vue-tsc
        versions: ['3.3.14']
      # PrimeVue stays at 4 with its themes at 1, since PrimeVue 5 needs a licence key.
      - dependency-name: primevue
        update-types: ['version-update:semver-major']
      - dependency-name: '@primeuix/themes'
        update-types: ['version-update:semver-major']
      # The lint tools the shared/ submodule owns move to a new major once, in the
      # submodule, with the plugins and configs that must match, and reach here with
      # `task shared:update`. Minors and patches still come here.
      - dependency-name: eslint
        update-types: ['version-update:semver-major']
      - dependency-name: 'eslint-*'
        update-types: ['version-update:semver-major']
      - dependency-name: prettier
        update-types: ['version-update:semver-major']
      - dependency-name: stylelint
        update-types: ['version-update:semver-major']
      - dependency-name: 'stylelint-*'
        update-types: ['version-update:semver-major']

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      go:
        patterns: ['*']
    ignore:
      # Moved by hand: the scs repository's store tags (sqlite3store/v1.4.1) read to
      # Dependabot as releases of this module, and the weekly run fails on them.
      - dependency-name: github.com/alexedwards/scs/sqlite3store

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
